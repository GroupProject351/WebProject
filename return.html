        </a>

</header>


<main class="return-container">

    <!-- سياسة الاسترجاع -->
    <section class="box">
        <h2>سياسة الاسترجاع</h2>
        <div class="content">
            <ol>
                <li>يتم قبول الاسترجاع خلال 7 أيام من تاريخ الاستلام.</li>
                <li>يجب أن تكون المنتجات غير مستخدمة وبحالتها الأصلية.</li>
                <li>يتم استرجاع المبلغ بنفس طريقة الدفع.</li>
            </ol>
        </div>
    </section>

    <!-- طلب الاسترجاع -->
    <section class="box">
        <h2>طلب الاسترجاع</h2>
        <div class="content">

            <form>

                <div class="form-group">
                    <label>الاسم *</label>
                    <input id="name" type="text">
                    <small id="nameError" class="error"></small>
                </div>

                <div class="form-group">
                    <label>رقم الجوال *</label>
                    <input id="phone" type="text">
                    <small id="phoneError" class="error"></small>
                </div>

                <div class="form-group">
                    <label>رقم الطلب *</label>
                    <input id="orderNumber" type="text" readonly>
                </div>

                <div class="form-group">
                    <label>اختر السبب *</label>
                    <select required>
                        <option value="" disabled selected>-- اختر السبب --</option>
                        <option>مقاس غير مناسب</option>
                        <option>منتج تالف</option>
                        <option>أخرى</option>
                    </select>
                </div>

                <button type="submit">إرسال</button>

            </form>

        </div>
    </section>

</main>
