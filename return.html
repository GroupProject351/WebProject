    <!-- ========== المحتوى الرئيسي ========== -->
    <main class="return-container">

        <h1 id="return_title">طلبات الاسترجاع</h1>

        <!-- سياسة الاسترجاع -->
        <div class="card">
            <button id="policy_btn" class="question">سياسة الاسترجاع</button>

            <div id="policy_content" class="answer">
                <ol>
                    <li>يتم قبول الاسترجاع خلال 7 أيام من تاريخ الاستلام.</li>
                    <li>يجب أن تكون المنتجات غير مستخدمة وبحالها الأصلية.</li>
                    <li>يتم استرجاع المبلغ بنفس طريقة الدفع.</li>
                </ol>
            </div>
        </div>

        <!-- طلب الاسترجاع -->
        <div class="card">
            <button id="form_title_btn" class="question">طلب الاسترجاع</button>

            <div class="answer">

                <form id="returnForm">

                    <div class="form-group">
                        <label id="lbl_name">الاسم *</label>
                        <input id="name" type="text">
                        <small id="nameError" class="error"></small>
                    </div>

                    <div class="form-group">
                        <label id="lbl_phone">رقم الجوال *</label>
                        <input id="phone" type="text" placeholder="05XXXXXXXX">
                        <small id="phoneError" class="error"></small>
                    </div>

                    <div class="form-group">
                        <label id="lbl_order">رقم الطلب *</label>
                        <input id="orderNumber" type="text" readonly placeholder="سيظهر تلقائيًا">
                    </div>

                    <div class="form-group">
                        <label id="lbl_reason">اختر السبب *</label>
                        <select id="reasonSelect" required>
                            <option value="" disabled selected id="opt_default">-- اختر السبب --</option>
                            <option id="opt_size">مقاس غير مناسب</option>
                            <option id="opt_damaged">منتج تالف</option>
                            <option id="opt_other">أخرى</option>
                        </select>
                    </div>

                    <button id="submit_btn" type="submit">إرسال</button>

                    <p id="successMsg" class="success-msg" style="display:none;">تم إرسال طلبك بنجاح</p>

                </form>

            </div>
        </div>

    </main>

            </div>

            </div>
