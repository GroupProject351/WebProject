    <link rel="stylesheet" href="shop-style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="https://i.ibb.co/Vpqp8P3N/image.png" alt="رونق">

            <ul>
                <li><a href="home page.html">الرئيسية</a></li>

        </nav>
          <div class="nav-spacer">
    <a href="payment.html">
        <i class="fa-solid fa-bag-shopping"></i>
    </a>
</div>
    </header>

    <main class="shop-container">
        <header class="shop-header">
            <h1>كل المنتجات</h1>
            <p>اكتشفي تشكيلتنا المختارة بعناية لتناسب ذوقك الرفيع</p>
        </header>

        <div class="shop-layout">
            <aside class="filters">
    <h3>تصفية حسب</h3>
    <div class="filter-group">
        <h4>الفئة</h4>
        <label><input type="checkbox" class="filter-category" value="معاطف"> معاطف</label>
        <label><input type="checkbox" class="filter-category" value="أكسسوارات"> أكسسوارات</label>
        <label><input type="checkbox" class="filter-category" value="طقم قطعتين"> طقم قطعتين</label>
    </div>
    <div class="filter-group">
        <h4>المقاس</h4>
        <div class="sizes">
            <label class="size-box">
                <input type="checkbox" class="filter-size" value="S" style="display:none">
                <span>S</span>
            </label>
            <label class="size-box">
                <input type="checkbox" class="filter-size" value="M" style="display:none">
                <span>M</span>
            </label>
            <label class="size-box">
                <input type="checkbox" class="filter-size" value="L" style="display:none">
                <span>L</span>
            </label>
            <label class="size-box">
                <input type="checkbox" class="filter-size" value="XL" style="display:none">
                <span>XL</span>
            </label>
        </div>
        <button id="clearFilters" class="clear-btn">مسح الفلاتر</button>
    </div>
</aside>

           <section class="products-grid" id="productsGrid">
    
    <article class="product-card" data-category="أكسسوارات" data-sizes="One Size" aria-labelledby="p1-title">
        <div class="product-image" style="background-image: url('https://images.pexels.com/photos/11310658/pexels-photo-11310658.jpeg');" role="img" aria-label="أساور يد أنيقة">
            <button class="add-to-cart-btn" onclick="addToCart(1, 'أساور يد', 100, 'حجم واحد')">
                إضافة للسلة
            </button>
        </div>
        <div class="product-info">
            <h4 id="p1-title">أساور يد</h4>
            <p class="price" aria-label="السعر مئة ريال">100 ر.س</p>
        </div>
    </article>

    <article class="product-card" data-category="طقم قطعتين" data-sizes="S,M,L,XL" aria-labelledby="p2-title">
        <div class="product-image" style="background-image: url('https://plus.unsplash.com/premium_photo-1682546467129-904577b589a0?q=80&w=687&auto=format&fit=crop');" role="img" aria-label="طقم رسمي كلاسيك">
           <select class="size-select" onchange="enableAdd(this)">
    <option value="">اختر المقاس</option>
    <option value="S">S</option>
    <option value="M">M</option>
    <option value="L">L</option>
    <option value="XL">XL</option>
</select>
<button class="add-to-cart-btn" onclick="addToCart(2, 'طقم رسمي كلاسيك', 420, this.previousElementSibling.value)">
    إضافة للسلة
</button>
        </div>
        <div class="product-info">
            <h4 id="p2-title">طقم رسمي كلاسيك</h4>
            <p class="price" aria-label="السعر أربعمائة وعشرون ريال">420 ر.س</p>
        </div>
    </article>

    <article class="product-card" data-category="معاطف" data-sizes="S,M,L" aria-labelledby="p3-title">
        <div class="product-image" style="background-image: url('https://plus.unsplash.com/premium_photo-1675186049366-64a655f8f537?q=80&w=687&auto=format&fit=crop');" role="img" aria-label="معطف أحمر شتوي">
            <select class="size-select" onchange="enableAdd(this)">
    <option value="">اختر المقاس</option>
    <option value="S">S</option>
    <option value="M">M</option>
    <option value="L">L</option>
</select>
<button class="add-to-cart-btn" onclick="addToCart(3, 'معطف أحمر', 290, this.previousElementSibling.value)">
    إضافة للسلة
</button>
        </div>
        <div class="product-info">
            <h4 id="p3-title">معطف أحمر</h4>
            <p class="price" aria-label="السعر مائتان وتسعون ريال">290 ر.س</p>
        </div>
    </article>

</section>
        </div>
    </main>
 <footer class="main-footer">

            </div>

                <a href="return.html">الأسترجاع</a>
            </div>

            <div class="payment-methods">
                <img src="https://cdn-icons-png.flaticon.com/512/196/196578.png" alt="Visa" class="pay-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968144.png" alt="Apple Pay" class="pay-icon">
                <img src="https://iconape.com/wp-content/files/sz/20472/png/Mada-01.png" alt="Mada" class="pay-icon">
            </div>
            
            <p class="copyright">Rawnaq 2026 ©</p>
        </div>

 <script src="shop.js"></script>
</body>
