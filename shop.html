<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر رونق - المنتجات</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="shop.css">
</head>

<body>

    <!-- ========== الهيدر الموحد ========== -->
    <header class="navbar">
        <div class="logo">
            <img src="https://i.ibb.co/Vpqp8P3N/image.png" alt="رونق">
        </div>

        <nav>
            <ul>
                <li><a id="nav_home" href="home-page.html">الرئيسية</a></li>
                <li><a id="nav_about" href="about.html">من نحن</a></li>
                <li><a id="nav_shop" href="shop.html" class="active">المتجر</a></li>
                <li><a id="nav_faq" href="FAQ.html">الأسئلة الشائعة</a></li>
                <li><a id="nav_return" href="return.html">طلبات الاسترجاع</a></li>
            </ul>
        </nav>

        <div class="nav-spacer">
            <a href="payment.html" class="cart-icon">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cartCount" class="cart-count">0</span>
            </a>

            <button onclick="toggleLanguage()" class="lang-btn">EN | AR</button>
        </div>
    </header>

    <!-- ========== محتوى المتجر ========== -->
    <main class="shop-container">

        <header class="shop-header">
            <h1 id="shop_title">كل المنتجات</h1>
            <p id="shop_subtitle">اكتشفي تشكيلتنا المختارة بعناية لتناسب ذوقك الرفيع</p>
        </header>

        <div class="shop-layout">

            <!-- ========== الفلاتر ========== -->
            <aside class="filters">
                <h3 id="filter_title">تصفية حسب</h3>

                <div class="filter-group">
                    <h4 id="filter_category">الفئة</h4>
                    <label><input type="checkbox" class="filter-category" value="معاطف"><span id="cat_coats"> معاطف </span></label>
                    <label><input type="checkbox" class="filter-category" value="أكسسوارات"><span id="cat_acc"> أكسسوارات</span></label>
                    <label><input type="checkbox" class="filter-category" value="طقم قطعتين"><span id="cat_sets"> طقم قطعتين</span></label>
                </div>

                <div class="filter-group">
                    <h4 id="filter_size">المقاس</h4>

                    <div class="sizes">
                        <label class="size-box"><input type="checkbox" class="filter-size" value="S" hidden><span>S</span></label>
                        <label class="size-box"><input type="checkbox" class="filter-size" value="M" hidden><span>M</span></label>
                        <label class="size-box"><input type="checkbox" class="filter-size" value="L" hidden><span>L</span></label>
                        <label class="size-box"><input type="checkbox" class="filter-size" value="XL" hidden><span>XL</span></label>
                    </div>

                    <button id="clearFilters" class="clear-btn">مسح الفلاتر</button>
                </div>
            </aside>

            <!-- ========== المنتجات ========== -->
            <section class="products-grid" id="productsGrid">

                <!-- المنتج 1 -->
                <article class="product-card" data-category="أكسسوارات" data-sizes="One Size">
                    <div class="product-image" style="background-image: url('https://images.pexels.com/photos/11310658/pexels-photo-11310658.jpeg');">
                        <span class="tag" id="tag_new">جديد</span>
                        <button id="add_to_cart_1" class="add-to-cart-btn" onclick="addToCart(1, 'أساور يد', 100, 'حجم واحد')">إضافة للسلة</button>
                    </div>
                    <div class="product-info">
                        <h4 id="prod_name_1">أساور يد</h4>
                        <p class="price">100 <span id="currency_1">ر.س</span></p>
                    </div>
                </article>

                <!-- المنتج 2 -->
                <article class="product-card" data-category="طقم قطعتين" data-sizes="S,M,L,XL">
                    <div class="product-image" style="background-image: url('https://plus.unsplash.com/premium_photo-1682546467129-904577b589a0?q=80&w=687&auto=format&fit=crop');">

                        <select class="size-select" onchange="enableAdd(this)">
                            <option value="" id="select_size_text">اختر المقاس</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                        </select>

                        <button id="add_to_cart_2" class="add-to-cart-btn" onclick="addToCart(2, 'طقم رسمي كلاسيك', 420, this.previousElementSibling.value)">إضافة للسلة</button>
                    </div>

                    <div class="product-info">
                        <h4 id="prod_name_2">طقم رسمي كلاسيك</h4>
                        <p class="price"><span id="prod_price_2">420</span> <span id="currency_2">ر.س</span></p>
                    </div>
                </article>

                <!-- المنتج 3 -->
                <article class="product-card" data-category="معاطف" data-sizes="S,M,L">
                    <div class="product-image" style="background-image: url('https://plus.unsplash.com/premium_photo-1675186049366-64a655f8f537?q=80&w=687&auto=format&fit=crop');">

                        <select class="size-select" onchange="enableAdd(this)">
                            <option value="" id="select_size_text">اختر المقاس</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                        </select>

                        <button id="add_to_cart_3" class="add-to-cart-btn" onclick="addToCart(3, 'معطف أحمر', 290, this.previousElementSibling.value)">إضافة للسلة</button>
                    </div>

                    <div class="product-info">
                        <h4 id="prod_name_3">معطف أحمر</h4>
                        <p class="price"><span id="prod_price_3">290</span> <span id="currency_3">ر.س</span></p>
                    </div>
                </article>

            </section>

        </div>
    </main>

    <!-- ========== الفوتر الموحد ========== -->
    <footer class="main-footer">
        <div class="container">

            <div class="footer-logo">
                <img src="https://i.ibb.co/Vpqp8P3N/image.png" alt="Rawnaq Logo">
            </div>

            <div class="social-links">
                <a href="https://instagram.com"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://wa.me/966545794428"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="mailto:2240006014@iau.edu.sa"><i class="fa-regular fa-envelope"></i></a>
            </div>

            <div class="footer-links">
                <a id="footer_return" href="return.html">الاسترجاع</a>
            </div>

            <div class="payment-methods">
                <img src="https://cdn-icons-png.flaticon.com/512/196/196578.png" class="pay-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968144.png" class="pay-icon">
                <img src="https://iconape.com/wp-content/files/sz/20472/png/Mada-01.png" class="pay-icon">
            </div>

            <p class="copyright">Rawnaq 2026 ©</p>
        </div>
    </footer>

    <script src="global.js"></script>
    <script src="shop.js"></script>
    <script src="language.js"></script>

</body>
</html>
