<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع - رونق</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="payment.css">
</head>

<body>

    <!-- ========== الهيدر الموحد ========== -->
    <header class="navbar">
        <div class="logo">
            <img src="https://i.ibb.co/Vpqp8P3N/image.png" alt="رونق">
        </div>

        <nav>
            <ul>
                <li><a id="nav_home" href="index.html">الرئيسية</a></li>
                <li><a id="nav_about" href="about.html">من نحن</a></li>
                <li><a id="nav_shop" href="shop.html">المتجر</a></li>
                <li><a id="nav_faq" href="FAQ.html">الأسئلة الشائعة</a></li>
                <li><a id="nav_return" href="return.html">طلبات الاسترجاع</a></li>
            </ul>
        </nav>

        <div class="nav-spacer">
            <a href="payment.html" class="cart-icon">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cartCount" class="cart-count">0</span>
            </a>

            <button onclick="toggleLanguage()" class="lang-btn">EN | AR</button>
        </div>
    </header>

    <!-- ========== المحتوى الرئيسي ========== -->
    <main class="payment-container">

    <h1 class="payment-title" id="payment_title">إتمام الدفع</h1>

    <!-- السلة -->
    <div class="card">
        <h2 class="section-title" id="cart_contents_title">محتويات السلة</h2>
        <div id="cartItems"></div>
        <h3 id="total"></h3>
        <button class="clear-btn" id="clear_cart_btn" onclick="clearCart()">مسح السلة</button>
    </div>

    <!-- فورم الدفع -->
    <div class="card">
        <h2 class="section-title" id="payment_info_title">أدخل بيانات الدفع</h2>

        <form id="paymentForm" novalidate>

            <!-- الاسم -->
            <div class="form-group">
                <label id="lbl_pay_name">الاسم *</label>
                <p class="example" id="example_1">مثال: لمياء عبدالله اليامي</p>
                <input type="text" id="name">
                <small id="nameError" class="error"></small>
            </div>

            <!-- رقم البطاقة -->
            <div class="form-group">
                <label id="lbl_pay_card">رقم البطاقة *</label>
                <p class="example" id="example_2">مثال: 1234 5678 9012 3456</p>
                <input type="text" id="card">
                <small id="cardError" class="error"></small>
            </div>

            <!-- رقم الجوال -->
            <div class="form-group">
                <label id="lbl_pay_phone">رقم الجوال *</label>
                <p class="example" id="example_3">مثال: 05X XXX XXXX</p>
                <input type="text" id="phone">
                <small id="phoneError" class="error"></small>
            </div>

            <button type="submit" class="submit-btn" id="pay_now_btn">ادفع الآن</button>

        </form>
    </div>

    <!-- طرق الدفع -->
    <div class="card">
        <h2 class="section-title" id="payment_methods_title">طرق الدفع</h2>

        <div class="logos">
            <img src="https://i.ibb.co/HL290jjZ/Mada.png" alt="Mada">
            <img src="https://cdn-icons-png.flaticon.com/512/196/196578.png" alt="Visa">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968144.png" alt="Apple Pay">
        </div>
    </div>

</main>


    <!-- ========== الفوتر الموحد ========== -->
    <footer class="main-footer">
        <div class="container">

            <div class="footer-logo">
                <img src="https://i.ibb.co/Vpqp8P3N/image.png" alt="Rawnaq Logo">
            </div>

            <div class="social-links">
                <a href="https://instagram.com"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://wa.me/966545794428"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="mailto:2240006014@iau.edu.sa"><i class="fa-regular fa-envelope"></i></a>
            </div>

            <div class="footer-links">
                <a id="footer_return" href="return.html">الاسترجاع</a>
            </div>

            <div class="payment-methods">
                <img src="https://cdn-icons-png.flaticon.com/512/196/196578.png" class="pay-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968144.png" class="pay-icon">
                <img src="https://iconape.com/wp-content/files/sz/20472/png/Mada-01.png" class="pay-icon">
            </div>

            <p class="copyright">Rawnaq 2026 ©</p>
        </div>
    </footer>

    <script src="payment.js"></script>
    <script src="language.js"></script>

</body>
</html>
