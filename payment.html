<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>متجر رونق-الدفع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="payment.css">
</head>

<body>

<header class="navbar">
        <div class="logo">
            <img src="https://i.ibb.co/Vpqp8P3N/image.png" alt="رونق">
        </div>
        <nav>
            <ul>
                <li><a href="home-page.html">الرئيسية</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="shop.html">المتجر</a></li>
                <li><a href="FAQ.html">الأسئلة الشائعة</a></li>
                <li><a href="return.html">طلبات الأسترجاع</a></li>
            </ul>
        </nav>
        <div class="nav-spacer">
         <a href="payment.html" class="cart-icon">
    <i class="fa-solid fa-bag-shopping"></i>
    <span id="cartCount" class="cart-count">0</span>
</a>

       </div>
    </header>

<main class="payment-container">

<div id="cartItems"></div>

<h3 id="total"></h3>
<button class="clear-btn" onclick="clearCart()">مسح السلة</button>

<section class="box">
<h2>أدخل بيانات الدفع</h2>

<form id="paymentForm" novalidate>

<div class="form-group">
    <label>الاسم *</label>
    <div class="hint">مثال: لمياء عبدالله اليامي</div>
    <input type="text" id="name">
    <small class="error-message" id="nameError"></small>
</div>


<div class="form-group">
    <label>رقم البطاقة *</label>
    <div class="hint">مثال: 1234 5678 9012 3456</div>
    <input type="text" id="card">
    <small class="error-message" id="cardError"></small>
</div>


<div class="form-group">
    <label>رقم الجوال *</label>
    <div class="hint">مثال: 05X XXX XXXX</div>
    <input type="text" id="phone">
    <small class="error-message" id="phoneError"></small>
</div>

<button type="submit">ادفع</button>
</form>


</section>

<section class="box">
<h2>طرق الدفع</h2>
<p>نحن نقبل مدى، فيزا وأبل باي</p>

<div class="logos">
<img src="https://i.ibb.co/HL290jjZ/Mada.png" alt="Mada">
<img src="https://cdn-icons-png.flaticon.com/512/196/196578.png" alt="visa">
<img src="https://cdn-icons-png.flaticon.com/512/5968/5968144.png" alt="Applepay">
</div>
</section>

</main>
        
<footer class="main-footer">
        <div class="container">
            <div class="footer-logo">
                <img src="https://i.ibb.co/Vpqp8P3N/image.png" alt="Rawnaq Logo">
            </div>

            <div class="social-links">
                <a href="https://instagram.com"><i class="fa-brands fa-instagram"></i></a>
                
                <a href="https://wa.me/966545794428"><i class="fa-brands fa-whatsapp"></i></a>
                
                <a href="mailto:2240006014@iau.edu.sa"><i class="fa-regular fa-envelope"></i></a>
            </div>

            <div class="footer-links">
                <a href="return.html">الأسترجاع</a>
            </div>

            <div class="payment-methods">
                <img src="https://cdn-icons-png.flaticon.com/512/196/196578.png" alt="Visa" class="pay-icon">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968144.png" alt="Apple Pay" class="pay-icon">
                <img src="https://iconape.com/wp-content/files/sz/20472/png/Mada-01.png" alt="Mada" class="pay-icon">
            </div>
            
            <p class="copyright">Rawnaq 2026 ©</p>
        </div>
    </footer>
    <script src="payment.js"></script>

</body>
</html>
